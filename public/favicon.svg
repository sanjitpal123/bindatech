<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Square -->
  <rect width="100" height="100" rx="24" fill="#070A0F"/>
  <rect width="98" height="98" x="1" y="1" rx="23" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Circuit lines (Cyan) -->
  <path d="M 22 35 L 42 35 L 50 45 L 58 45" stroke="url(#cyanGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 18 48 L 36 48 L 44 56 L 56 56" stroke="url(#cyanGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 24 62 L 40 62 L 48 56" stroke="url(#cyanGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Circuit Nodes -->
  <circle cx="22" cy="35" r="3" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="18" cy="48" r="3" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="24" cy="62" r="3" fill="#06B6D4" filter="url(#glow)"/>

  <!-- Stylized Metallic Silver B -->
  <path d="M 45 25 L 70 25 C 80 25, 80 43, 68 46 C 82 49, 82 72, 68 72 L 45 72 Z" fill="none" stroke="url(#silverGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>